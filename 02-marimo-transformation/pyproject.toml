[project]
name = "a2a-labs"
version = "0.1.0"
description = "Marimo Transformation — governed A2A foundation (a2a_labs) for the A2AWalkthrough labs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx",
    "nest_asyncio",
    "blake3",
]

[project.optional-dependencies]
server = [
    "litellm>=1.80.16",
    "google-adk[a2a]==1.19.0",
    "a2a-sdk[http-server]==0.3.16",
    "mcp==1.19.0",
    "python-dotenv",
]
marimo = [
    "marimo",
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_labs"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint.isort]
case-sensitive = true
lines-after-imports = 1

[tool.ruff.lint.pydocstyle]
convention = "google"
